name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Agent-native audit
        run: pnpm agent:audit

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint web
        run: pnpm --filter @roam/web lint

      - name: Lint landing
        run: pnpm --filter @roam/landing lint

      - name: Test API
        run: pnpm --filter @roam/api test

      - name: Test catalog
        run: pnpm --filter @roam/catalog test

      # Nothing above proves the app BUILDS from clean or that the built app renders.
      # A typecheck says the code is well-formed; it does not say the page comes up.
      - name: Build
        run: ./scripts/oracle/run.sh --only build

      - name: Smoke — boot the build and drive its routes
        run: ./scripts/oracle/run.sh --only smoke

      - name: Verdict
        if: always()
        run: ./scripts/oracle/run.sh --json > oracle.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-verdict
          path: oracle.json
          if-no-files-found: ignore
