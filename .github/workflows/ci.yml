name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Agent-native audit
        run: pnpm agent:audit

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint web
        run: pnpm --filter @roam/web lint

      - name: Lint landing
        run: pnpm --filter @roam/landing lint

      - name: Test API
        run: pnpm --filter @roam/api test

      - name: Test catalog
        run: pnpm --filter @roam/catalog test

      # Nothing above proves the app BUILDS from clean or that the built app renders.
      # A typecheck says the code is well-formed; it does not say the page comes up.
      - name: Build
        run: ./scripts/oracle/run.sh --only build

      - name: Smoke — boot the build and drive its routes
        run: ./scripts/oracle/run.sh --only smoke

      # Unlike the visual gate below, this one is platform-independent: it measures
      # geometry and event ordering, not pixels, so the ubuntu runner is as good a
      # witness as macOS. It is here because R-301 spent two UAT rounds unable to
      # answer "does the sheet follow the finger" — the acceptance suite drove a
      # mouse, which never takes the touch path at all.
      - name: Install Playwright chromium
        run: pnpm --filter @roam/web exec playwright install --with-deps chromium

      - name: Gesture — drive the sheet with real touch input
        run: ./scripts/oracle/run.sh --only gesture

      # The visual gate deliberately does NOT run here yet. Font rasterisation differs
      # between macOS and ubuntu-latest, so the committed darwin baselines would fail
      # on this runner for reasons that have nothing to do with the design — and a gate
      # that is expected to be red gets ignored, then bypassed.
      #
      # The agent runs it locally on every change, where the baselines match. To gate
      # it here too, record a linux set once and commit it:
      #   ./scripts/oracle/visual.sh --accept   (on ubuntu, e.g. via workflow_dispatch)
      # then add the two steps below. snapshotPathTemplate already keeps the platforms
      # apart, so the darwin baselines stay valid.
      #
      # - run: pnpm --filter @roam/web exec playwright install --with-deps chromium chromium-headless-shell
      # - run: ./scripts/oracle/run.sh --only visual

      # This step re-runs every gate to produce the JSON artifact, and two of them
      # must not run here.
      #
      # `visual`: deliberately not run in CI (see above). It used to skip itself by
      # accident — there was no chromium on the runner — and the gesture gate's
      # install changed that, turning a fast bogus failure into ten real minutes of
      # writing baselines nobody will keep.
      #
      # `gesture`: already ran above as its own required step, which is the
      # authoritative run and passes in ~17s. Re-running it inside this aggregation
      # fails all six checks at page load — the planner never reports a planning
      # space — and burns nine minutes of retries doing it. That is an environment
      # difference between the two invocations, not a verdict on the gate, and it is
      # not isolated yet; the artifact should not record it as one.
      - name: Verdict
        if: always()
        env:
          ORACLE_SKIP: visual,gesture
        run: ./scripts/oracle/run.sh --json > oracle.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-verdict
          path: oracle.json
          if-no-files-found: ignore
